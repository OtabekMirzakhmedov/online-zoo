<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Zoo | Home</title>
    <link rel="icon" href="../../assets/icons/favicon.png.jpg" type="image/png">
    <link rel="stylesheet" href="../shared.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <div class="container header__container">
            <a href="#" class="header__logo" aria-label="Online Zoo home">
                <img class="header__logo-img" src="../../assets/icons/logo-online-zoo.svg" alt="Online Zoo">
            </a>
            <nav class="header__nav" aria-label="Primary">
                <ul class="header__nav-list">
                    <li class="header__nav-item">
                        <a href="../landing/index.html" class="header__nav-link header__nav-link--active">About</a>
                    </li>
                    <li class="header__nav-item">
                        <a href="../map/index.html" class="header__nav-link">Map</a>
                    </li>
                    <li class="header__nav-item">
                        <a href="#" class="header__nav-link">Zoos</a>
                    </li>
                    <li class="header__nav-item">
                        <a href="../contact/index.html" class="header__nav-link">Contact us</a>
                    </li>
                    <li class="header__nav-item">
                        <a href="https://www.figma.com/design/lnK11foY8Aoa6oOlDXovVN/Online-ZOO-Project"
                            class="header__nav-link header__nav-link--design" target="_blank"
                            rel="noreferrer">Design</a>
                    </li>
                </ul>
            </nav>
            <div class="header__social" aria-label="Social links">
                <a class="header__social-link" href="#" aria-label="YouTube">
                    <img class="header__social-icon" src="../../assets/icons/icon-youtube.svg" alt="">
                </a>
                <a class="header__social-link" href="#" aria-label="Instagram">
                    <img class="header__social-icon" src="../../assets/icons/icon-instagram.svg" alt="">
                </a>
                <a class="header__social-link" href="#" aria-label="Facebook">
                    <img class="header__social-icon" src="../../assets/icons/icon-facebook.svg" alt="">
                </a>
            </div>
        </div>
    </header>

    <main class="main">
        <section class="hero">
            <div class="container hero__container">
                <div class="hero__content">
                    <h2 class="hero__title">Watch your <br> favorite animal <br> online</h2>
                    <p class="hero__subtitle">
                        Explore the exciting and mysterious world of wild animals in a natural setting without
                        leaving your home.
                    </p>
                    <a href="../map/index.html" class="btn btn--primary hero__cta">
                        <span class="btn__text">View live cam</span>
                        <span class="btn__icon" aria-hidden="true">→</span>
                    </a>
                </div>
            </div>
        </section>

    </main>

    <footer class="footer">
        <div class="container footer__container">
            <a href="#" class="footer__logo" aria-label="Online Zoo home">
                <img class="footer__logo-img" src="../../assets/icons/logo-online-zoo.svg" alt="Online Zoo">
            </a>
        </div>
    </footer>

    <script src="script.js"></script>
</body>

</html>
